#:schema https://www.schemastore.org/prek.json
# Git hooks (https://prek.j178.dev). Enable once per clone: `prek install`.

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

# Prettier and ESLint have no builtin hooks; these use the versions in package.json.
[[repos]]
repo = "local"
hooks = [
  { id = "prettier", name = "prettier", language = "system", entry = "node_modules/.bin/prettier --write --ignore-unknown", types = ["text"] },
  { id = "eslint", name = "eslint", language = "system", entry = "node_modules/.bin/eslint --fix --no-warn-ignored", files = '\.(js|mjs|ts|svelte)$' },
]
