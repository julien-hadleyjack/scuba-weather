#:schema https://www.schemastore.org/prek.json
# Git hooks, run by prek (https://prek.j178.dev). Install once per clone:
#   prek install
# Prettier and ESLint run from node_modules, so their versions come from
# package.json and are updated with the other npm dependencies.

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "prettier", name = "prettier", language = "system", entry = "npx --no-install prettier --write --ignore-unknown", types = ["text"] },
  { id = "eslint", name = "eslint", language = "system", entry = "npx --no-install eslint --fix --no-warn-ignored", files = '\.(js|mjs|ts|svelte)$' },
  # Whole-project checks are too slow for every commit; run them before push.
  { id = "svelte-check", name = "svelte-check", language = "system", entry = "npm run check", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "vitest", name = "vitest", language = "system", entry = "npm test", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
