<!doctype html>
<!-- Scuba Weather wireframe: Choose dive spot, place chosen. Static mockup (390 px wide); see SPEC.md for the behaviour. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe · Choose dive spot, place chosen</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <style>
      body {
        margin: 0;
      }
      a {
        color: #0a5f86;
      }
      a:hover {
        color: #063f5a;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 390px;
        height: 844px;
        box-sizing: border-box;
        background: #eef2f5;
        font-family: 'Inter', system-ui, sans-serif;
        color: #0e1a26;
        display: flex;
        flex-direction: column;
      "
    >
      <header
        style="
          background: #ffffff;
          padding: 10px 16px 14px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          border-bottom: 1px solid #d9e1e8;
          position: relative;
          z-index: 2;
        "
      >
        <div style="display: flex; align-items: center; gap: 8px">
          <a
            href="dashboard.html"
            aria-label="Back to dashboard"
            style="
              width: 44px;
              height: 44px;
              border-radius: 12px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #0e1a26;
            "
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5M12 19l-7-7 7-7"></path></svg
          ></a>
          <h1 style="margin: 0; font-size: 18px; font-weight: 700">Choose dive spot</h1>
        </div>
        <label for="place-search" style="font-size: 13px; color: #4a5a6a; padding: 0 4px"
          >Search a place, island or dive site</label
        >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            border: 2px solid #0a5f86;
            border-radius: 12px;
            padding: 0 6px 0 12px;
            background: #ffffff;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4A5A6A"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            id="place-search"
            type="search"
            value="chalok"
            style="
              flex: 1;
              min-width: 0;
              border: none;
              outline: none;
              font: inherit;
              font-size: 16px;
              color: #0e1a26;
              background: transparent;
            "
          />
          <button
            aria-label="Clear search"
            style="
              width: 36px;
              height: 36px;
              border-radius: 18px;
              border: none;
              background: #eef2f5;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #4a5a6a;
              padding: 0;
            "
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </header>

      <div
        style="position: relative; flex: 1; min-height: 0; background: #bfdceb; overflow: hidden"
      >
        <svg
          width="390"
          height="100%"
          viewBox="0 0 390 470"
          preserveAspectRatio="xMidYMid slice"
          aria-hidden="true"
          style="position: absolute; left: 0; top: 0"
        >
          <path
            d="M120 60 C 180 30, 280 50, 300 120 C 320 190, 290 250, 250 270 C 230 280, 222 248, 195 252 C 168 256, 160 285, 140 275 C 100 255, 80 200, 85 150 C 88 110, 95 80, 120 60 Z"
            fill="#E9E4D4"
            stroke="#C9C0A6"
            stroke-width="1.5"
          ></path>
          <path
            d="M300 300 C 320 290, 345 300, 340 320 C 335 338, 310 336, 302 324 C 296 315, 294 305, 300 300 Z"
            fill="#E9E4D4"
            stroke="#C9C0A6"
            stroke-width="1.5"
          ></path>
          <text
            x="160"
            y="150"
            font-family="Inter, system-ui, sans-serif"
            font-size="14"
            font-weight="600"
            fill="#5C5440"
          >
            Koh Tao
          </text>
          <text
            x="215"
            y="300"
            font-family="Inter, system-ui, sans-serif"
            font-size="12"
            fill="#0B4A66"
          >
            Chalok Bay
          </text>
          <ellipse cx="195" cy="300" rx="8" ry="3" fill="#0E1A26" opacity="0.25"></ellipse>
          <path
            d="M195 300 C 195 300, 177 278, 177 266 A 18 18 0 0 1 213 266 C 213 278, 195 300, 195 300 Z"
            fill="#0A5F86"
            stroke="#FFFFFF"
            stroke-width="2"
          ></path>
          <circle cx="195" cy="266" r="6" fill="#FFFFFF"></circle>
        </svg>
        <div
          style="
            position: absolute;
            right: 12px;
            top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
          "
        >
          <button
            aria-label="Zoom in"
            style="
              width: 44px;
              height: 44px;
              border-radius: 12px;
              border: 1px solid #d9e1e8;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #0e1a26;
              padding: 0;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button
            aria-label="Zoom out"
            style="
              width: 44px;
              height: 44px;
              border-radius: 12px;
              border: 1px solid #d9e1e8;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #0e1a26;
              padding: 0;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
            </svg>
          </button>
        </div>
        <span
          style="
            position: absolute;
            left: 12px;
            top: 14px;
            font-size: 11px;
            color: #2e4657;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 8px;
            border-radius: 6px;
          "
          >Map placeholder</span
        >
        <span
          style="
            position: absolute;
            right: 8px;
            bottom: 22px;
            font-size: 10px;
            color: #2e4657;
            background: rgba(255, 255, 255, 0.85);
            padding: 2px 6px;
            border-radius: 4px;
          "
          >© OpenStreetMap contributors</span
        >
      </div>

      <div
        style="
          background: #ffffff;
          border-radius: 20px 20px 0 0;
          margin-top: -16px;
          position: relative;
          padding: 20px 20px 24px;
          display: flex;
          flex-direction: column;
          gap: 14px;
          box-shadow: 0 -2px 12px rgba(14, 26, 38, 0.08);
        "
      >
        <div
          style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px"
        >
          <div style="display: flex; flex-direction: column; gap: 2px">
            <strong style="font-size: 18px; font-weight: 700">Chalok Bay</strong>
            <span style="font-size: 13px; color: #4a5a6a">Surat Thani, Thailand</span>
          </div>
          <span style="font-size: 12px; color: #5f6e7c; padding-top: 4px">10.06° N, 99.82° E</span>
        </div>
        <p style="margin: 0; font-size: 13px; color: #4a5a6a; line-height: 1.5">
          Drag the map to move the pin onto open water close to your dive site.
        </p>
        <a
          href="dashboard.html"
          style="
            height: 52px;
            border-radius: 14px;
            background: #0a5f86;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
          "
          >Use this spot</a
        >
      </div>
    </div>
  </body>
</html>
