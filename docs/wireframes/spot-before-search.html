<!doctype html>
<!-- Scuba Weather wireframe: Choose dive spot, before search. Static mockup (390 px wide); see SPEC.md for the behaviour. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe · Choose dive spot, before search</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <style>
      body {
        margin: 0;
      }
      a {
        color: #0a5f86;
      }
      a:hover {
        color: #063f5a;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 390px;
        height: 844px;
        box-sizing: border-box;
        background: #eef2f5;
        font-family: 'Inter', system-ui, sans-serif;
        color: #0e1a26;
        display: flex;
        flex-direction: column;
      "
    >
      <header
        style="
          background: #ffffff;
          padding: 10px 16px 14px;
          display: flex;
          flex-direction: column;
          gap: 8px;
          border-bottom: 1px solid #d9e1e8;
        "
      >
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
          <h1 style="margin: 0; font-size: 18px; font-weight: 700">Choose dive spot</h1>
        </div>
        <label for="place-search-empty" style="font-size: 13px; color: #4a5a6a; padding: 0 4px"
          >Search a place, island or dive site</label
        >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            border: 2px solid #0a5f86;
            border-radius: 12px;
            padding: 0 6px 0 12px;
            background: #ffffff;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#4A5A6A"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input
            id="place-search-empty"
            type="search"
            value=""
            style="
              flex: 1;
              min-width: 0;
              border: none;
              outline: none;
              font: inherit;
              font-size: 16px;
              color: #0e1a26;
              background: transparent;
            "
          />
        </div>
      </header>

      <div
        style="
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 20px 32px;
          text-align: center;
          color: #4a5a6a;
          font-size: 14px;
          line-height: 1.5;
        "
      >
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#0A5F86"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <p style="margin: 0">Search for a place, island or dive site above.</p>
      </div>
    </div>
  </body>
</html>
